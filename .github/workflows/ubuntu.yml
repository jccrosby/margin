name: Check Margin on Ubuntu

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install ACL test tools
        run: sudo apt-get install -y acl
      - name: Verify x64 and ext4
        run: |
          test "$(uname -m)" = x86_64
          test "$(findmnt --noheadings --output FSTYPE --target /tmp)" = ext4
          stat -c '%U:%G %a %n' /home /tmp
          getfacl -cp /home /tmp
          temp="$(mktemp -d /tmp/margin-ci.XXXXXXXX)"
          echo "TMPDIR=$temp" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Check installed package over stdio
        run: |
          tarball="$RUNNER_TEMP/margin.tgz"
          pnpm pack --out "$tarball"
          node scripts/check-package.js "$tarball" --candidate
          git rev-parse HEAD
          sha256sum "$tarball"
      - name: Retrieve project text in a fresh Codex thread
        run: |
          npm install --prefix "$RUNNER_TEMP/codex" --ignore-scripts --no-save '@openai/codex@0.171.0'
          node scripts/check-codex.js "$RUNNER_TEMP/margin.tgz" "$RUNNER_TEMP/codex/node_modules/.bin/codex"
      - name: Run CLI and MCP tests
        timeout-minutes: 5
        env:
          MARGIN_TEST_BIND_MOUNTS: '1'
        run: pnpm test --test-reporter=tap
