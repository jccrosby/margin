name: Release Margin

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: margin-package-release
      cancel-in-progress: false
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: '@jccrosby'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Pack and check the release
        id: pack
        run: |
          archive=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          tarball="$RUNNER_TEMP/$archive"
          node scripts/check-package.js "$tarball"
          git rev-parse HEAD
          shasum -a 256 "$tarball" > "$tarball.sha256"
          cat "$tarball.sha256"
          printf 'tarball=%s\n' "$tarball" >> "$GITHUB_OUTPUT"
      - name: Publish the checked tarball
        env:
          MARGIN_TARBALL: ${{ steps.pack.outputs.tarball }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! name=$(npm view @jccrosby/margin name --prefer-online --registry=https://npm.pkg.github.com) ||
              [[ "$name" != '@jccrosby/margin' ]]; then
            echo 'Cannot read @jccrosby/margin. Publish the first version privately and grant this repository Write access under Manage Actions access.'
            exit 1
          fi
          shasum -a 256 --check "$MARGIN_TARBALL.sha256"
          npm publish "$MARGIN_TARBALL" --ignore-scripts --registry=https://npm.pkg.github.com
