name: Check Margin on Windows

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Check installed package over stdio
        run: |
          $tarball = Join-Path $env:RUNNER_TEMP 'margin.tgz'
          pnpm pack --out $tarball
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-package.js $tarball --candidate
      - name: Run CLI and MCP tests
        timeout-minutes: 5
        run: node --test --test-reporter=tap
